[RocketZoom]
; 1 = enabled, 0 = disabled
Enable = 1

; Zoom IN : mouse wheel up   | RT
; Zoom OUT: mouse wheel down | LT
MouseWheel = 1
PadButtons = 1

; 1 = also applies to the Heat-Seeker (guided rocket launcher)
HeatSeeker = 1

; Field of view (FOV) in degrees. 70 = no zoom. The game's camera can go down to 3.0.
MinFov = 3.0
MaxFov = 70.0

; Zoom speed (1.0 = same as the game's camera)
Speed = 1.0

; 1 = generates RocketZoom.log next to the .asi (diagnostics)
Log = 0